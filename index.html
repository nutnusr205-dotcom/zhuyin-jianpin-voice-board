<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#15bfc0"><title>注音簡拼發聲板</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>*{box-sizing:border-box}body{margin:0;background:#f4fbfb;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#263238}main{width:min(900px,100%);margin:auto;padding:8px}.panel{background:#fff;border-radius:22px;padding:12px;box-shadow:0 4px 18px #0001;margin-bottom:8px}h1{text-align:center;color:#087f80;font-size:26px;margin:0 0 9px}.top{display:grid;grid-template-columns:1fr auto auto;gap:6px}#sentence{min-height:68px;border:3px solid #60d4d0;border-radius:18px;padding:10px;font-size:27px;font-weight:700}.big{border:0;border-radius:17px;padding:10px 14px;font-size:20px;font-weight:800}.speak{background:#ffd84d}.clear{background:#ff9fb5}.label{font-size:17px;font-weight:800;margin:10px 0 6px}#favorites{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.fav{border:2px solid #ffd26c;background:#fff8d8;border-radius:15px;min-height:54px;font-size:17px;font-weight:800}#sequence{min-height:46px;border:2px dashed #67cbc8;border-radius:15px;padding:7px 10px;font-size:24px;font-weight:800;color:#087f80}.hint{font-size:13px;color:#657575;margin-top:4px}#cands{display:flex;gap:6px;overflow-x:auto;padding:3px 0 6px;min-height:51px}.cand{flex:0 0 auto;border:2px solid #65ccc8;background:#fff;border-radius:14px;padding:8px 12px;font-size:21px;font-weight:800}.keyboard{background:#dff8f6;border-radius:22px;padding:8px 6px}#keys{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px}.key{height:58px;min-width:0;padding:0;border:0;border-radius:12px;background:#fff;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:27px;font-weight:800;box-shadow:0 2px 6px #0002}.blank{visibility:hidden;pointer-events:none}.key:disabled{background:#d7dddd;color:#9aa3a3;box-shadow:none;opacity:.58}.del{background:#98e4c2}footer{text-align:center;padding:10px 4px 3px;font-size:16px}.source-note{font-size:13px;line-height:1.5;color:#657575;margin-bottom:3px}@media(max-width:480px){main{padding:5px}.panel{padding:9px}h1{font-size:22px}.top{gap:4px}#sentence{font-size:21px;min-height:58px;padding:8px}.big{font-size:16px;padding:8px}.label{font-size:15px}#favorites{gap:3px}.fav{font-size:15px;min-height:48px;padding:1px}#sequence{font-size:21px;min-height:42px}.keyboard{padding:7px 5px}#keys{gap:4px}.key{height:55px;font-size:25px}footer{font-size:14px}}</style></head><body><main><section class="panel"><h1>注音簡拼發聲板</h1><div class="top"><div id="sentence"></div><button class="big speak" id="speak">🔊</button><button class="big clear" id="clear">清除</button></div><div class="label">常用語（長按可儲存目前句子）</div><div id="favorites"></div><div class="label">簡拼輸入</div><div id="sequence">請按每個字的第一個注音</div><div class="hint">例如：「我要喝水」→ ㄨ　ㄧ　ㄏ　ㄕ；灰色按鍵表示目前沒有可接續的預測。</div><div class="label">預測詞句</div><div id="cands"></div></section><section class="keyboard"><div id="keys"></div></section><footer><div class="source-note">字音資料：教育部《國語辭典簡編本》（2026-09-29）；注音發音：教育部《國語注音符號手冊》（CC BY 4.0）</div><div>國立臺南大學特教系 臧永佳 AI設計開發</div></footer></main><script src="app.js?v=2"></script></body></html>
