<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#15bfc0"><title>注音簡拼發聲板</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>*{box-sizing:border-box}body{margin:0;background:#f4fbfb;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#263238}main{width:min(900px,100%);margin:auto;padding:8px}.panel{background:#fff;border-radius:22px;padding:12px;box-shadow:0 4px 18px #0001;margin-bottom:8px}h1{text-align:center;color:#087f80;font-size:26px;margin:0 0 9px}.top{display:grid;grid-template-columns:1fr auto auto;gap:6px}#sentence{min-height:68px;border:3px solid #60d4d0;border-radius:18px;padding:10px;font-size:27px;font-weight:700}.big{border:0;border-radius:17px;padding:10px 14px;font-size:20px;font-weight:800}.speak{background:#ffd84d}.clear{background:#ff9fb5}.label{font-size:17px;font-weight:800;margin:10px 0 6px}#favorites{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.fav{border:2px solid #ffd26c;background:#fff8d8;border-radius:15px;min-height:54px;font-size:17px;font-weight:800}#sequence{min-height:46px;border:2px dashed #67cbc8;border-radius:15px;padding:7px 10px;font-size:24px;font-weight:800;color:#087f80}.hint{font-size:13px;color:#657575;margin-top:4px}#cands{display:flex;gap:6px;overflow-x:auto;padding:3px 0 6px;min-height:51px}.cand{flex:0 0 auto;border:2px solid #65ccc8;background:#fff;border-radius:14px;padding:8px 12px;font-size:21px;font-weight:800}.keyboard{background:#dff8f6;border-radius:22px;padding:8px 6px}#keys{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px}.key{height:58px;min-width:0;padding:0;border:0;border-radius:12px;background:#fff;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:27px;font-weight:800;box-shadow:0 2px 6px #0002}.blank{visibility:hidden;pointer-events:none}.key:disabled{background:#d7dddd;color:#9aa3a3;box-shadow:none;opacity:.58}.del{background:#98e4c2}footer{text-align:center;padding:10px 4px 3px;font-size:16px}.source-note{font-size:13px;line-height:1.5;color:#657575;margin-bottom:3px}@media(max-width:480px){main{padding:5px}.panel{padding:9px}h1{font-size:22px}.top{gap:4px}#sentence{font-size:21px;min-height:58px;padding:8px}.big{font-size:16px;padding:8px}.label{font-size:15px}#favorites{gap:3px}.fav{font-size:15px;min-height:48px;padding:1px}#sequence{font-size:21px;min-height:42px}.keyboard{padding:7px 5px}#keys{gap:4px}.key{height:55px;font-size:25px}footer{font-size:14px}}
.dev-credit{font-size:18px;color:#263238;margin-bottom:5px}
.source-credit{font-size:15px;color:#607d80;line-height:1.5}
@media(max-width:480px){
 .dev-credit{font-size:16px}
 .source-credit{font-size:13px;padding:0 6px}
}

</style>
<style id="responsive-v606">
/* v6.0.6 responsive layout: phone stays compact; tablets use available space. */
html,body{max-width:100%;overflow-x:hidden}
.wrap{width:min(96%,1180px);max-width:1180px;margin-left:auto;margin-right:auto}
.keyboard{width:100%;box-sizing:border-box}
.keys{width:100%;box-sizing:border-box}
.key{min-width:0}

/* iPhone / narrow phones */
@media (max-width: 600px){
  .wrap{width:100%;max-width:none;padding-left:8px;padding-right:8px;box-sizing:border-box}
  .card{padding:12px}
  h1{font-size:clamp(24px,7vw,32px)}
  .top{gap:8px}
  #sentence{min-height:64px;font-size:24px}
  .speak,.clear{min-width:58px;min-height:58px}
  .favrow{gap:6px}
  .fav{min-width:0;padding:10px 5px;font-size:16px}
  #seq{font-size:24px;min-height:54px;padding:10px}
  .cand{font-size:18px;padding:10px 12px;min-height:48px}
  .keyboard{padding:8px}
  .key{font-size:clamp(20px,6vw,28px);min-height:52px;padding:4px}
  footer{font-size:13px;line-height:1.45;padding:12px 6px}
}

/* iPad portrait / medium tablets */
@media (min-width: 601px) and (max-width: 1024px){
  .wrap{width:96%;max-width:none}
  .card{padding:18px}
  h1{font-size:34px}
  #sentence{min-height:82px;font-size:30px}
  .speak,.clear{min-width:76px;min-height:76px;font-size:24px}
  .fav{font-size:20px;min-height:62px}
  #seq{font-size:30px;min-height:66px}
  .cand{font-size:22px;min-height:54px;padding:11px 16px}
  .keyboard{padding:12px}
  .key{font-size:30px;min-height:68px}
  footer{font-size:16px;padding:14px 8px}
}

/* iPad landscape and larger tablets */
@media (min-width: 1025px) and (max-width: 1500px){
  .wrap{width:94%;max-width:1380px}
  .card{padding:20px 22px}
  h1{font-size:36px}
  #sentence{min-height:86px;font-size:32px}
  .speak,.clear{min-width:82px;min-height:82px;font-size:25px}
  .fav{font-size:21px;min-height:66px}
  #seq{font-size:31px;min-height:68px}
  .cand{font-size:23px;min-height:56px;padding:12px 17px}
  .keyboard{padding:14px}
  .key{font-size:32px;min-height:72px}
  footer{font-size:17px;padding:14px 8px 18px}
}

/* desktop: don't stretch excessively */
@media (min-width:1501px){
  .wrap{width:92%;max-width:1380px}
}
</style>


<style id="responsive-v607-strong">
/* Strong tablet overrides — intentionally later than all previous CSS */
@media (min-width: 768px) and (max-width: 1500px){
  body{padding-left:8px!important;padding-right:8px!important}
  .wrap{
    width:98vw!important;
    max-width:none!important;
    margin:0 auto!important;
    padding-left:0!important;
    padding-right:0!important;
  }
  .card{
    width:100%!important;
    max-width:none!important;
    box-sizing:border-box!important;
    padding:16px 18px!important;
    margin-left:0!important;
    margin-right:0!important;
  }
  h1{font-size:38px!important;margin:4px 0 12px!important}
  .top{gap:10px!important}
  #sentence{
    min-height:86px!important;
    font-size:32px!important;
    border-width:3px!important;
  }
  .speak,.clear{
    min-width:88px!important;
    min-height:82px!important;
    font-size:26px!important;
  }
  .favrow{gap:8px!important}
  .fav{
    min-height:66px!important;
    font-size:22px!important;
    padding:8px!important;
  }
  #seq{
    min-height:66px!important;
    font-size:32px!important;
    padding:10px 14px!important;
  }
  #cands{min-height:66px!important}
  .cand{
    min-height:58px!important;
    font-size:24px!important;
    padding:10px 16px!important;
  }
  .keyboard{
    width:100%!important;
    max-width:none!important;
    box-sizing:border-box!important;
    padding:10px!important;
    margin-top:8px!important;
  }
  .keys{
    width:100%!important;
    max-width:none!important;
    gap:7px!important;
  }
  .key{
    min-width:0!important;
    min-height:72px!important;
    height:72px!important;
    font-size:34px!important;
    padding:4px!important;
  }
  footer{
    margin-top:8px!important;
    padding:8px!important;
    font-size:17px!important;
    line-height:1.4!important;
  }
}
/* iPad landscape: use nearly the entire horizontal canvas */
@media (min-width: 1024px) and (orientation: landscape) and (max-width: 1500px){
  .wrap{width:99vw!important}
  .card{padding:14px 16px!important}
  .keyboard{padding:8px!important}
  .key{height:76px!important;min-height:76px!important;font-size:36px!important}
}
/* Phones remain compact and independent from tablet sizing */
@media (max-width: 767px){
  .wrap{width:100%!important;max-width:none!important}
  .key{min-height:52px!important;height:auto!important}
}
</style>

</head><body><main><section class="panel"><h1>注音簡拼發聲板</h1><div class="top"><div id="sentence"></div><button class="big speak" id="speak">🔊</button><button class="big clear" id="clear">清除</button></div><div class="label">常用語（長按可儲存目前句子）</div><div id="favorites"></div><div class="label">簡拼輸入</div><div id="sequence">請按每個字的第一個注音</div><div class="hint">例如：「我要喝水」→ ㄨ　ㄧ　ㄏ　ㄕ；灰色按鍵表示目前沒有可接續的預測。</div><div class="label">預測詞句</div><div id="cands"></div></section><section class="keyboard"><div id="keys"></div></section><footer>
